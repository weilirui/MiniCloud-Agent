name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (new modules)
        run: |
          python -m ruff check \
            app/core/agent.py app/core/retry.py \
            app/api/chat.py app/api/sessions.py app/api/feedback.py \
            app/rag/lexical.py app/rag/hybrid.py app/rag/retriever.py \
            app/core/prompt_store.py app/observability app/feedback \
            app/schemas/feedback.py \
            eval scripts tests --select E4,E7,E9,F

      - name: Build golden dataset
        env:
          OPENAI_API_KEY: ci-placeholder
        run: python scripts/build_golden_dataset.py

      - name: Unit + e2e tests
        env:
          OPENAI_API_KEY: ci-placeholder
        run: |
          python -m pytest -q \
            --cov=app --cov-report=term-missing --cov-fail-under=55

      - name: Retrieval evaluation (offline)
        env:
          OPENAI_API_KEY: ci-placeholder
        run: python -m eval.runner

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval/reports/
