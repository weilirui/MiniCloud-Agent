[project]
name = "minicloud-agent"
version = "0.1.0"
description = "Mini Agent platform with RAG, Skills, MCP"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    
    # LLM
    "openai>=1.50,<2.0",
    "tiktoken>=0.8,<1.0",
    
    # Agent / LangChain
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    
    # RAG
    "qdrant-client>=1.12,<1.13",
    "langchain-text-splitters>=0.3,<0.4",
    
    # MCP
    "mcp>=1.0,<2.0",
    
    # DB
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    
    # Pydantic / Config
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    
    # Utils
    "structlog>=24.4,<25.0",
    "httpx>=0.27,<1.0",
    "python-frontmatter>=1.1,<2.0",
    "python-multipart>=0.0.12,<1.0",
    
    # File parsing
    "Markdown>=3.5",
    "pypdf>=5.0",
    "chardet>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0",
    "ruff>=0.7,<1.0",
    "ipython>=8.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: requires a real PostgreSQL / Qdrant (run with --run-integration)",
    "live: calls a real LLM API and costs money (run with --run-live)",
]