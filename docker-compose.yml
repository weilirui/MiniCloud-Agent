services:
  postgres:
    image: postgres:16-alpine
    container_name: minicloud-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minicloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minicloud}
      POSTGRES_DB: ${POSTGRES_DB:-minicloud}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minicloud}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: minicloud-qdrant
    ports:
      # 6333/6334 fall inside Windows' Hyper-V reserved port range (6292-6391),
      # so they're remapped to host ports outside that range. Backend still
      # reaches Qdrant at qdrant:6333 on the internal network.
      - "16333:6333"
      - "16334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      # qdrant image ships neither wget nor curl; use bash /dev/tcp to probe the port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minicloud-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./backend/app/skills/builtin:/app/app/skills/builtin
      - ./backend/mcp.servers.json:/app/mcp.servers.json
      # Bind-mounted for development only: the image ships neither tests nor the
      # eval harness, and `make backend-test` runs the suite inside this container.
      - ./backend/tests:/app/tests
      - ./backend/eval:/app/eval
      - ./backend/scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minicloud-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

networks:
  default:
    name: minicloud-net